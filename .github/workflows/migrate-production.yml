# Applies the database migrations to the PRODUCTION Supabase project.
# Started by hand only. Approval is required in the "production" environment (GitHub ▸ Settings ▸ Environments).
# First run with "apply" unchecked (dry run), read the result, then run again with "apply" checked.
# Only after this succeeds may the code be merged into main (Vercel then publishes it automatically).
name: Migrate Production

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the migrations for real. Leave unchecked for a dry run that only shows what would change."
        type: boolean
        default: false

permissions:
  contents: read

# Never two production migrations at once, and never cancel one halfway.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check this is the production project
        run: |
          if [ "$SUPABASE_PROJECT_REF" != "culqeemdrhuvzweessra" ]; then
            echo "SUPABASE_PROJECT_REF is not the production project. Stopping."
            exit 1
          fi
      - name: Link to the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show what would change (dry run)
        run: supabase db push --dry-run
      - name: Apply migrations
        if: ${{ inputs.apply }}
        run: supabase db push
      - name: Show migration status
        if: ${{ inputs.apply }}
        run: supabase migration list
