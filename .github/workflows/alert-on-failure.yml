# Raises an alert when one of the important automations fails, and closes it when it works again.
# How it works: when "Backup Production", "Verify Backup" or "Migrate Production" finishes,
# this workflow looks at the result. On failure it opens a GitHub Issue (assigned to the
# repository owner, so GitHub sends an e-mail) with a link to the failed run.
# If the same automation fails again, a comment is added to the open issue instead of a new issue.
# When the automation succeeds again, the issue is closed automatically.
# Note: GitHub runs "workflow_run" workflows only from the default branch (main).
name: Alert on Failure

on:
  workflow_run:
    workflows: ["Backup Production", "Verify Backup", "Migrate Production"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Ignore cancelled/skipped runs; only act on real failures and real successes.
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/github-script@v7
        env:
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
          OWNER: ${{ github.repository_owner }}
        with:
          script: |
            const { RUN_NAME, RUN_URL, RUN_RESULT, OWNER } = process.env;
            const { owner, repo } = context.repo;
            const label = "automation-failure";
            const title = `Automation failed: ${RUN_NAME}`;

            // Make sure the label exists (ignore the error if it already does).
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: "d73a4a",
                description: "An automated workflow failed",
              });
            } catch (e) { /* already exists */ }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: label, per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);

            if (RUN_RESULT === "failure") {
              const body = `The automation **${RUN_NAME}** failed.\n\nSee what went wrong: ${RUN_URL}`;
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Failed again. ${RUN_URL}`,
                });
              } else {
                await github.rest.issues.create({
                  owner, repo, title, labels: [label], assignees: [OWNER],
                  body: `@${OWNER} ${body}\n\nThis issue closes by itself when the automation succeeds again.`,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Works again. ${RUN_URL}\n\nClosing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number,
                state: "closed", state_reason: "completed",
              });
            }
